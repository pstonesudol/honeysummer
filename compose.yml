name: honeysummer

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: honeysummer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honeysummer"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: local-docker-development-key
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/honeysummer
    command: ["./docker-entrypoint.dev.sh"]
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      API_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_CLOUDFLARE_DEV_INIT: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/frontend/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
