name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: honeysummer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d honeysummer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Verify lockfile is in sync
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check
      - name: ruff format check
        run: uv run ruff format --check

      - name: Migrate the Postgres test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honeysummer
      - name: pytest
        run: uv run pytest
        env:
          # The SQLite suite runs unconditionally; this enables the opt-in
          # Postgres inventory and reset/MFA concurrency tests.
          INVENTORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honeysummer
          SECURITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honeysummer

  frontend:
    name: frontend (eslint + cart tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: eslint
        run: npm run lint --workspace frontend
      - name: Cart unit tests
        run: npm run test --workspace frontend
