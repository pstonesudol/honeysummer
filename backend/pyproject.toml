[project]
name = "honey-summer-backend"
version = "0.1.0"
description = "Sanic API for Honey Summer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "stripe==14.3.0",
    "sanic>=25.12.1",
    "sanic-ext>=25.12.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "resend>=2.49.1",
    "python-multipart>=0.0.32",
    "boto3>=1.40,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "sanic-testing>=24.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # Python errors; includes imports at top of file
    "E501",            # Enforce the 120-character line limit
    "F",               # Undefined names, unused imports, etc.
    "I",               # Sort and group imports
    "B",               # Common bug patterns
    "UP",              # Modern Python syntax
    "PLC0415",         # Require imports at module level
    "D100",            # Module docstrings
    "D101",            # Public class docstrings
    "D102",            # Public method docstrings
    "D103",            # Public function docstrings
    "D104",            # Package docstrings (__init__.py)
    "D105",            # Magic method docstrings
    "D106",            # Public nested class docstrings
    "D107",            # __init__ docstrings
]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are machine-generated boilerplate: documenting them adds
# no value and future autogenerated revisions would immediately fail the check.
"migrations/**" = ["D"]
# Test function names describe intent; requiring docstrings on every test adds
# noise without documenting the public API.
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120
