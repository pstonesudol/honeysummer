[project]
name = "honey-summer-backend"
version = "0.1.0"
description = "Sanic API for Honey Summer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "stripe==14.3.0",
    "sanic>=25.12.1",
    "sanic-ext>=25.12.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "resend>=2.49.1",
    "python-multipart>=0.0.32",
    "boto3>=1.40,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sanic-testing>=24.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
